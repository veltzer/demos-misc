# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[processor.checker.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.shellcheck]
src_dirs = ["gwt/scripts"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

# not linted: grails/grails-intro/target (committed grails build output)
[processor.checker.ixmllint]
src_dirs = ["grails/grails-intro", "gwt"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.checker.cppcheck]
src_dirs = ["llvm"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checker.checkstyle]
src_dirs = ["gwt"]
args = ["-c", "checkstyle.xml"]

# ─── html ────────────────────────────────────────────────────────────────────

# not linted: grails/grails-intro/target (committed grails build output)
[processor.checker.tidy]
src_dirs = ["gwt"]

# ─── css ─────────────────────────────────────────────────────────────────────

# not linted: grails/grails-intro/target (committed grails build output)
# Only .css is passed: biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["grails/grails-intro/web-app/css", "gwt"]
src_extensions = [".css"]

# ─── javascript ──────────────────────────────────────────────────────────────

# not linted: gwt/Example07GwtJsni/war/scripts (vendored prototype/scriptaculous)
[processor.checker.oxlint]
src_dirs = ["grails/grails-intro/web-app/js"]
args = ["-c", ".oxlintrc.json"]
